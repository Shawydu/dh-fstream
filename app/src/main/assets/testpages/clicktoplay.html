<!doctype html><html><head><meta charset="utf-8"><title>clicktoplay</title>
<style>html,body{margin:0;background:#000;overflow:hidden}video{width:100vw;height:100vh}
#ov{position:fixed;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,.6);color:#fff;font:48px sans-serif;display:flex;align-items:center;justify-content:center}</style></head>
<body><canvas id="c" width="320" height="180" style="display:none"></canvas>
<video id="v" muted playsinline></video>
<div id="ov">click to play</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),n=0;
setInterval(function(){n++;x.fillStyle='hsl('+(n*5%360)+',80%,50%)';x.fillRect(0,0,320,180);x.fillStyle='#fff';x.fillText(n,20,90);},40);
var v=document.getElementById('v');v.srcObject=c.captureStream(25);
document.getElementById('ov').addEventListener('click',function(){v.play();this.style.display='none';});
</script></body></html>
